<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="이번주 식단">
<meta name="theme-color" content="#d97757">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>이번주 식단</title>
<style>
  :root{
    --bg:#faf8f4; --card:#fff; --text:#2c2621; --sub:#7a6f64;
    --line:#e8e0d5; --accent:#d97757; --accent2:#7a9e5e; --accent3:#5b87b8;
    --chip:#f2ece3; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
    --done:#b5aa9c; --cool:#e8f0e2;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1c1a18; --card:#262320; --text:#eae4dc; --sub:#a39687;
      --line:#3a352f; --accent:#e08b6d; --accent2:#8fb36f; --accent3:#7aa3d0;
      --chip:#322d28; --shadow:0 1px 3px rgba(0,0,0,.3); --done:#6b6157; --cool:#2c3527;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:820px;margin:0 auto;padding:14px 14px 90px}
  header{text-align:center;padding:14px 0 10px}
  h1{font-size:1.35rem;letter-spacing:-.02em}
  .lead{color:var(--sub);font-size:.83rem;margin-top:3px}

  nav.tabs{
    display:flex;gap:6px;position:sticky;top:0;z-index:20;
    background:var(--bg);padding:9px 0;border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    flex:1;font:inherit;font-weight:600;font-size:.86rem;cursor:pointer;
    background:var(--chip);color:var(--sub);border:none;border-radius:10px;
    min-height:44px;padding:8px 4px;transition:.15s;
  }
  nav.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
  section.pane{display:none;padding-top:14px}
  section.pane.on{display:block}

  /* 끼니 필터 */
  .seg{display:flex;gap:5px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:13px}
  .seg button{
    flex:1;font:inherit;font-weight:700;font-size:.82rem;cursor:pointer;border:none;
    background:transparent;color:var(--sub);border-radius:9px;min-height:44px;padding:6px 2px;transition:.15s;
  }
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}

  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .btn{
    font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;border:none;
    border-radius:10px;min-height:44px;padding:10px 16px;color:#fff;background:var(--accent);
    flex:1;min-width:130px;
  }
  .btn:active{opacity:.75}
  .btn.sec{background:var(--chip);color:var(--text)}
  .btn.g{background:var(--accent2)}

  /* 냉장고 */
  details.fridge{
    background:var(--cool);border:1px solid var(--line);border-radius:14px;
    padding:12px 13px;margin-bottom:12px;
  }
  details.fridge summary{
    font-weight:700;font-size:.9rem;cursor:pointer;list-style:none;
    min-height:32px;display:flex;align-items:center;gap:7px;
  }
  details.fridge summary::-webkit-details-marker{display:none}
  details.fridge summary::after{content:"▾";margin-left:auto;color:var(--sub);font-size:.8rem}
  details.fridge[open] summary::after{content:"▴"}
  .fhelp{font-size:.78rem;color:var(--sub);margin:8px 0 7px}
  textarea#fridgeIn{
    width:100%;font:inherit;font-size:.9rem;padding:10px;border-radius:9px;
    border:1px solid var(--line);background:var(--card);color:var(--text);
    min-height:70px;resize:vertical;
  }
  .ftags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .ftag{
    font-size:.76rem;font-weight:600;background:var(--card);border:1px solid var(--accent2);
    color:var(--accent2);padding:3px 9px;border-radius:20px;
  }

  .day{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .day.today{border-color:var(--accent);border-width:2px}
  .dayhead{font-weight:800;font-size:.98rem;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .badge{font-size:.66rem;font-weight:700;background:var(--accent);color:#fff;padding:2px 7px;border-radius:20px}
  .badge.f{background:var(--accent2)}
  .slot{
    display:flex;align-items:flex-start;gap:9px;padding:8px 0;
    border-top:1px solid var(--line);
  }
  .slot:first-of-type{border-top:none}
  .slotlabel{
    font-size:.72rem;font-weight:700;color:var(--sub);background:var(--chip);
    border-radius:6px;padding:3px 6px;white-space:nowrap;min-width:52px;text-align:center;flex-shrink:0;
  }
  .slotbody{flex:1;min-width:0}
  .slotname{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .slotsub{font-size:.78rem;color:var(--sub);margin-top:1px}
  .reroll{
    background:none;border:none;font-size:1.05rem;cursor:pointer;padding:6px;
    min-width:44px;min-height:44px;flex-shrink:0;color:var(--sub);
  }
  .reroll:active{opacity:.5}

  .shop h3{
    font-size:.9rem;margin:18px 0 6px;color:var(--accent);
    display:flex;align-items:center;gap:6px;
  }
  .shop h3:first-child{margin-top:0}
  .shop h3.have{color:var(--accent2)}
  .item{
    display:flex;align-items:flex-start;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;
    cursor:pointer;min-height:44px;
  }
  .item.checked .nm{text-decoration:line-through;color:var(--done)}
  .item.have{background:var(--cool);opacity:.85}
  .box{
    width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff;margin-top:1px;
  }
  .item.checked .box{background:var(--accent2);border-color:var(--accent2)}
  .itembody{flex:1;min-width:0}
  .nm{font-size:.92rem;font-weight:600}
  .forwhat{font-size:.74rem;color:var(--sub);margin-top:2px;line-height:1.45}
  .cnt{font-size:.74rem;color:var(--sub);background:var(--chip);padding:2px 7px;border-radius:20px;flex-shrink:0;margin-top:1px}

  .empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:.9rem;line-height:1.8}

  details.pool{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:8px;
  }
  details.pool summary{font-weight:700;font-size:.93rem;cursor:pointer;list-style:none;min-height:32px;display:flex;align-items:center;gap:7px}
  details.pool summary::-webkit-details-marker{display:none}
  details.pool summary::after{content:"▾";margin-left:auto;color:var(--sub);font-size:.8rem}
  details.pool[open] summary::after{content:"▴"}
  .rec{font-size:.84rem;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .rec .ing{color:var(--sub);margin-bottom:5px}
  .rec b{color:var(--accent)}
  .t{font-size:.68rem;font-weight:700;background:var(--chip);color:var(--sub);padding:2px 7px;border-radius:20px}
  .t.fast{background:var(--accent2);color:#fff}

  footer{margin-top:30px;font-size:.75rem;color:var(--sub);text-align:center;line-height:1.7}
  .saved{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
    background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:.83rem;
    font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
  }
  .saved.show{opacity:.94}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>🍳 이번주 식단</h1>
  <p class="lead">버튼 한 번이면 일주일 식단과 장보기 목록이 나와요</p>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" onclick="tab(0,this)">📅 식단표</button>
  <button role="tab" aria-selected="false" onclick="tab(1,this)">🛒 장보기</button>
  <button role="tab" aria-selected="false" onclick="tab(2,this)">📖 메뉴 전체</button>
</nav>

<!-- 식단표 -->
<section class="pane on">
  <details class="fridge" id="fridgeBox">
    <summary>🧊 냉장고에 있는 재료 <span class="badge f" id="fcount" style="display:none"></span></summary>
    <div class="fhelp">여기 적어두면 <b>그 재료를 쓰는 메뉴를 먼저 뽑아줍니다.</b> 쉼표나 줄바꿈으로 구분해서 적으세요. (예: 양파, 계란, 두부)</div>
    <textarea id="fridgeIn" placeholder="양파, 계란, 감자, 김치..." oninput="onFridgeInput()"></textarea>
    <div class="ftags" id="ftags"></div>
  </details>

  <div class="bar">
    <button class="btn" onclick="rollWeek()">🎲 일주일치 새로 뽑기</button>
    <button class="btn sec" onclick="clearWeek()">지우기</button>
  </div>

  <div class="seg" role="group" aria-label="끼니 보기">
    <button aria-pressed="true" onclick="setFilter('all',this)">전체</button>
    <button aria-pressed="false" onclick="setFilter('b',this)">☀️ 아침</button>
    <button aria-pressed="false" onclick="setFilter('l',this)">🍱 점심</button>
    <button aria-pressed="false" onclick="setFilter('d',this)">🌙 저녁</button>
  </div>

  <div id="week"></div>
</section>

<!-- 장보기 -->
<section class="pane">
  <div class="bar">
    <button class="btn g" onclick="copyList()">📋 목록 복사</button>
    <button class="btn sec" onclick="resetChecks()">체크 초기화</button>
  </div>
  <div class="seg" role="group" aria-label="끼니 보기">
    <button aria-pressed="true" onclick="setFilter('all',this)">전체</button>
    <button aria-pressed="false" onclick="setFilter('b',this)">☀️ 아침</button>
    <button aria-pressed="false" onclick="setFilter('l',this)">🍱 점심</button>
    <button aria-pressed="false" onclick="setFilter('d',this)">🌙 저녁</button>
  </div>
  <div id="shop" class="shop"></div>
</section>

<!-- 메뉴 전체 -->
<section class="pane">
  <div class="seg" role="group" aria-label="끼니 보기">
    <button aria-pressed="true" onclick="setFilter('all',this)">전체</button>
    <button aria-pressed="false" onclick="setFilter('b',this)">☀️ 아침</button>
    <button aria-pressed="false" onclick="setFilter('l',this)">🍱 점심</button>
    <button aria-pressed="false" onclick="setFilter('d',this)">🌙 저녁</button>
    <button aria-pressed="false" onclick="setFilter('e',this)">🍰 기타</button>
  </div>
  <div id="allpool"></div>
</section>

<footer>
  노션 「인스타 저장 아카이브」 레시피 52건에서 정리한 메뉴 풀<br>
  아침 24 · 도시락 25 · 저녁 41 · 기타 8<br>
  마지막 업데이트 2026-07-27
</footer>

</div>
<div class="saved" id="toast">저장됨</div>

<script>

    {n:"해외에서 유행하는 감자샐러드", t:"사이드", ing:[["감자","채"],["오이","채"],["계란","유"],["베이컨","정"],["그릭요거트","유"],["마요네즈","양"],["머스타드","양"],["꿀","양"]],
     r:"소스: 그릭요거트 3스푼 · 마요네즈 2스푼 · 꿀 1스푼(선택) · 머스터드 1스푼 · 우유 2스푼 · 후추·소금",
     how:"<b>①</b> 오이 ½개를 얇게 썰어 소금 ½스푼으로 10분 절여 물기 꼭 짜기 <b>②</b> 감자와 계란은 삶기 <b>③</b> 베이컨은 바삭하게 굽기 <b>④</b> 모두 넣고 소스로 버무리기 · 모닝빵에 딸기잼 바르고 듬뿍 넣어 먹는 조합 강추"},
    {n:"크리미 매쉬포테이토 + 새송이 스테이크", t:"사이드", ing:[["감자","채"],["새송이버섯","채"],["생크림","유"],["우유","유"],["버터","유"],["파마산 치즈","유"],["올리브유","양"],["소금","양"]],
     r:"감자 2개 기준 · 생크림 80ml · 우유 80ml± · 버터 30g · 파마산 20g · 다른 치즈 ⅓컵(선택) · 새송이 1개",
     how:"<b>①</b> 버터·치즈·생크림·우유를 미리 계량해 <b>실온</b>에 꺼내두기 <b>②</b> 으깨는 용기와 담을 그릇을 따뜻하게 <b>③</b> 약불에서 생크림·우유를 조금씩 넣고 저어 촤르르 흐르는 농도로 <b>④</b> 트러플 오일이나 트러플 솔트를 살짝 더하면 풍미가 확 올라가요"},
    {n:"명란 두부", t:"밥반찬 10분", ing:[["명란","정"],["두부","가"],["청양고추","채"],["버터","유"],["고춧가루","양"],["멸치액젓","양"],["꿀","양"]],
     how:"<b>①</b> 청양고추 2개를 잘게 썰고 고춧가루 2스푼·버터 2덩이·멸치액젓 1스푼·설탕이나 꿀을 넣어 볶기 <b>②</b> 명란 2알을 잘라 넣고 마저 볶기 <b>③</b> 순두부나 두부(실크두부면 더 좋아요) 위에 얹기 · 그대로 밥에 비벼 먹어도 맛있어요"},
    {n:"뿔뽀 (문어구이)", t:"안주", ing:[["자숙문어","정"],["감자","채"],["버터","유"],["올리브유","양"],["파프리카가루","양"],["레몬","채"],["다진마늘","양"]],
     r:"자숙문어 1팩 · 감자 3개 / 소스: 올리브유 3T · 레몬즙 1T · 다진마늘 · 파슬리",
     how:"<b>①</b> 감자를 잘라 물 3T 넣고 렌지 8분 <b>②</b> 올리브유에 소금간해 노릇하게 굽기 <b>③</b> 자숙문어는 상온 해동 후 물기를 꼼꼼히 닦기 <b>④</b> 같은 팬에 버터 2T 녹여 조금 센 불에서 굽기 (소금·파프리카가루) <b>⑤</b> 노릇해지면 <b>바로 자르지 말고 불 끄고 3분 뒤</b> 자르기 (바로 자르면 수분이 많이 나와요) <b>⑥</b> 소스 뿌리기"}
  ]
};

const DAYS = ["월","화","수","목","금","토","일"];
const SLOTS = [["b","아침"],["l","도시락"],["d","저녁"]];
const SLOTNAME = {b:"아침", l:"점심", d:"저녁"};
const KEY = "weeklyMenu.v1";
const KEYCHK = "weeklyMenu.checks.v1";
const KEYFRIDGE = "weeklyMenu.fridge.v1";

let week = null;
let checks = {};
let fridge = [];          // ["양파","계란"]
let filter = 'all';       // 'all' | 'b' | 'l' | 'd'

/* ---------- 저장 / 불러오기 ---------- */
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(week));
    localStorage.setItem(KEYCHK, JSON.stringify(checks));
    localStorage.setItem(KEYFRIDGE, JSON.stringify(fridge));
  }catch(e){}
}
function load(){
  try{
    const w = localStorage.getItem(KEY); if(w) week = JSON.parse(w);
    const c = localStorage.getItem(KEYCHK); if(c) checks = JSON.parse(c) || {};
    const f = localStorage.getItem(KEYFRIDGE); if(f) fridge = JSON.parse(f) || [];
  }catch(e){ week=null; checks={}; fridge=[]; }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1400);
}

/* ---------- 냉장고 ---------- */
function parseFridge(txt){
  return txt.split(/[,，\n·]/).map(s=>s.trim()).filter(s=>s.length>=1);
}
function onFridgeInput(){
  fridge = parseFridge(document.getElementById('fridgeIn').value);
  save(); renderFridgeTags(); render();
}
function renderFridgeTags(){
  const box = document.getElementById('ftags');
  box.innerHTML = fridge.map(f=>`<span class="ftag">${esc(f)}</span>`).join("");
  const c = document.getElementById('fcount');
  if(fridge.length){ c.style.display=''; c.textContent = fridge.length+"개"; }
  else c.style.display='none';
}
/* 재료 하나가 냉장고에 있나 */
function inFridge(ingName){
  return fridge.some(f=>{
    if(f.length<1) return false;
    return ingName.includes(f) || f.includes(ingName);
  });
}
/* 메뉴가 냉장고 재료를 몇 개 쓰나 (양념 제외) */
function fridgeScore(m){
  let s = 0;
  (m.ing||[]).forEach(([name,cat])=>{ if(cat!=="양" && inFridge(name)) s++; });
  return s;
}

/* ---------- 뽑기 (냉장고 재료 우선) ---------- */
function pickWeighted(key, count){
  const pool = POOL[key];
  const arr = pool.map((m,i)=>({i, s:fridgeScore(m), r:Math.random()}));
  // 점수 높은 것 먼저, 같은 점수끼리는 무작위
  arr.sort((a,b)=> b.s - a.s || a.r - b.r);
  const out=[];
  for(let k=0;k<count;k++) out.push(arr[k % arr.length].i);
  return out;
}
function rollWeek(){
  const b = pickWeighted('b',7), l = pickWeighted('l',7), d = pickWeighted('d',7);
  week = DAYS.map((_,i)=>({b:b[i], l:l[i], d:d[i]}));
  checks = {};
  save(); render();
  const hit = week.reduce((n,day)=> n + SLOTS.filter(([k])=>fridgeScore(POOL[k][day[k]])>0).length, 0);
  toast(fridge.length ? `일주일치 완성 · 냉장고 활용 ${hit}끼` : "일주일치 뽑았어요");
}
function reroll(dayIdx, slot){
  const used = week.map(w=>w[slot]);
  const pool = POOL[slot];
  const cand = pool.map((m,i)=>({i, s:fridgeScore(m), r:Math.random()}))
                   .filter(x=>!used.includes(x.i));
  if(!cand.length){ toast("더 바꿀 메뉴가 없어요"); return; }
  cand.sort((a,b)=> b.s - a.s || a.r - b.r);
  // 상위 절반 중에서 무작위 (너무 뻔하지 않게)
  const top = cand.slice(0, Math.max(1, Math.ceil(cand.length/2)));
  week[dayIdx][slot] = top[Math.floor(Math.random()*top.length)].i;
  save(); render();
}
function clearWeek(){
  week = null; checks = {}; save(); render(); toast("지웠어요");
}

/* ---------- 필터 ---------- */
function setFilter(f, btn){
  filter = f;
  const want = btn.textContent.trim();
  document.querySelectorAll('.seg').forEach(seg=>{
    const btns = [...seg.querySelectorAll('button')];
    const hit = btns.find(b=>b.textContent.trim()===want);
    // 「기타」 버튼이 없는 칸(식단표·장보기)은 '전체'로 되돌려 둔다
    btns.forEach(b=>b.setAttribute('aria-pressed',
      String(hit ? b===hit : b.textContent.trim()==='전체')));
  });
  render(); renderPool();
}
/* 기타는 일주일 식단에 들어가지 않으므로, 식단표·장보기에서는 전체와 같게 본다 */
function mealFilter(){ return filter==='e' ? 'all' : filter; }
function activeSlots(){
  const f = mealFilter();
  return f==='all' ? SLOTS : SLOTS.filter(([k])=>k===f);
}

/* ---------- 화면 ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayIdx(){ const d=new Date(); return (d.getDay()+6)%7; }

function render(){
  const wrap = document.getElementById('week');
  if(!week){
    wrap.innerHTML = '<div class="empty">아직 식단이 없어요.<br>위 <b>🎲 일주일치 새로 뽑기</b>를 눌러보세요.<br><br>냉장고에 있는 재료를 먼저 적어두면<br>그 재료를 쓰는 메뉴로 뽑아드려요.</div>';
    renderShop(); return;
  }
  const ti = todayIdx();
  const slots = activeSlots();
  wrap.innerHTML = week.map((day,i)=>{
    const rows = slots.map(([k,label])=>{
      const m = POOL[k][day[k]];
      const sub = m.sub ? m.sub : (m.t || "");
      const fs = fridgeScore(m);
      return `<div class="slot">
        <span class="slotlabel">${label}</span>
        <div class="slotbody">
          <div class="slotname">${esc(m.n)}${fs?`<span class="badge f">🧊 ${fs}</span>`:''}</div>
          ${sub?`<div class="slotsub">${esc(sub)}</div>`:""}
        </div>
        <button class="reroll" onclick="reroll(${i},'${k}')" aria-label="다시 뽑기">🔄</button>
      </div>`;
    }).join("");
    return `<div class="day${i===ti?' today':''}">
      <div class="dayhead">${DAYS[i]}요일 ${i===ti?'<span class="badge">오늘</span>':''}</div>
      ${rows}
    </div>`;
  }).join("");
  renderShop();
}

/* 장보기: 현재 필터에 해당하는 끼니만 집계 + 어떤 메뉴 때문인지 기록 */
function buildShop(){
  if(!week) return {};
  const map = {};
  const slots = activeSlots();
  week.forEach((day,di)=>{
    slots.forEach(([k])=>{
      const m = POOL[k][day[k]];
      (m.ing||[]).forEach(([name,cat])=>{
        if(!map[name]) map[name] = {cat, cnt:0, meals:[]};
        map[name].cnt++;
        const tag = `${DAYS[di]} ${SLOTNAME[k]} ${m.n}`;
        if(!map[name].meals.includes(tag)) map[name].meals.push(tag);
      });
    });
  });
  return map;
}
function renderShop(){
  const el = document.getElementById('shop');
  const map = buildShop();
  const names = Object.keys(map);
  if(!names.length){
    el.innerHTML = '<div class="empty">식단을 먼저 뽑으면<br>장보기 목록이 자동으로 만들어져요.</div>';
    return;
  }
  const mf = mealFilter();
  const label = mf==='all' ? '' :
    `<div class="fhelp" style="margin:0 0 10px">${SLOTNAME[mf]} 메뉴에 필요한 재료만 보고 있어요</div>`;

  const have = names.filter(n=>inFridge(n));
  const need = names.filter(n=>!inFridge(n));

  let html = label;
  CATORDER.forEach(c=>{
    const list = need.filter(n=>map[n].cat===c)
                     .sort((a,b)=>map[b].cnt-map[a].cnt || a.localeCompare(b,'ko'));
    if(!list.length) return;
    html += `<h3>${CAT[c]} <span class="cnt">${list.length}</span></h3>`;
    html += list.map(n=>itemHtml(n, map[n])).join("");
  });
  if(have.length){
    html += `<h3 class="have">🧊 냉장고에 있음 — 안 사도 돼요 <span class="cnt">${have.length}</span></h3>`;
    html += have.sort((a,b)=>a.localeCompare(b,'ko')).map(n=>itemHtml(n, map[n], true)).join("");
  }
  el.innerHTML = html;
}
function itemHtml(n, info, isHave){
  const on = !!checks[n];
  const meals = info.meals.slice(0,3).join(' · ') + (info.meals.length>3?` 외 ${info.meals.length-3}`:'');
  return `<div class="item${on?' checked':''}${isHave?' have':''}" onclick="toggle(${JSON.stringify(n)})">
    <span class="box">${on?'✓':''}</span>
    <div class="itembody">
      <div class="nm">${esc(n)}</div>
      <div class="forwhat">${esc(meals)}</div>
    </div>
    ${info.cnt>1?`<span class="cnt">${info.cnt}끼</span>`:''}
  </div>`;
}
function toggle(name){ checks[name] = !checks[name]; save(); renderShop(); }
function resetChecks(){ checks = {}; save(); renderShop(); toast("체크를 지웠어요"); }

function copyList(){
  const map = buildShop();
  const names = Object.keys(map).filter(n=>!inFridge(n));
  if(!names.length){ toast("먼저 식단을 뽑아주세요"); return; }
  const mf = mealFilter();
  let txt = `🛒 이번주 장보기${mf==='all'?'':' ('+SLOTNAME[mf]+'만)'}\n`;
  CATORDER.forEach(c=>{
    const list = names.filter(n=>map[n].cat===c).sort((a,b)=>a.localeCompare(b,'ko'));
    if(!list.length) return;
    txt += `\n[${CAT[c]}]\n` + list.map(n=>`- ${n}${map[n].cnt>1?` (${map[n].cnt}끼)`:''}`).join("\n") + "\n";
  });
  const done = ()=>toast("복사했어요");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt,done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, cb){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast("복사 실패"); }
  document.body.removeChild(ta);
}

function renderPool(){
  const el = document.getElementById('allpool');
  const groups = [["b","☀️ 아침 (10분 안에)"],["l","🍱 도시락"],["d","🌙 저녁"],
                  ["e","🍰 기타 (디저트 · 안주 · 밑반찬 · 드레싱)"]]
    .filter(([k])=> filter==='all' || k===filter);
  el.innerHTML = groups.map(([k,title])=>{
    const items = POOL[k].map(m=>{
      const fs = fridgeScore(m);
      return `<details class="pool">
        <summary>${esc(m.n)} ${m.t?`<span class="t fast">${m.t}</span>`:''}${fs?`<span class="badge f">🧊 ${fs}</span>`:''}</summary>
        <div class="rec">
          ${m.sub?`<div class="ing">${esc(m.sub)}</div>`:''}
          ${m.r?`<div class="ing">${esc(m.r)}</div>`:''}
          ${m.how?`<div>${m.how}</div>`:''}
          ${!m.how&&!m.r?`<div class="ing">재료: ${(m.ing||[]).map(x=>esc(x[0])).join(' · ')}</div>`:''}
        </div>
      </details>`;
    }).join("");
    const note = k==='e'
      ? '<div class="fhelp" style="margin:0 0 9px">한 끼 식사가 아니라서 <b>일주일 뽑기에는 들어가지 않아요.</b> 필요할 때 여기서 찾아보세요.</div>'
      : '';
    return `<h3 style="font-size:1rem;margin:18px 0 8px">${title} <span class="cnt">${POOL[k].length}</span></h3>${note}${items}`;
  }).join("");
}

function tab(i, btn){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected','false'));
  btn.setAttribute('aria-selected','true');
  document.querySelectorAll('section.pane').forEach((s,n)=>s.classList.toggle('on', n===i));
  window.scrollTo({top:0, behavior:'smooth'});
}

load();
document.getElementById('fridgeIn').value = fridge.join(', ');
if(fridge.length) document.getElementById('fridgeBox').setAttribute('open','');
renderFridgeTags();
render();
renderPool();
</script>
