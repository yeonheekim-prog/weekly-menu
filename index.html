<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="이번주 식단">
<meta name="theme-color" content="#d97757">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>이번주 식단</title>
<style>
  :root{
    --bg:#faf8f4; --card:#fff; --text:#2c2621; --sub:#7a6f64;
    --line:#e8e0d5; --accent:#d97757; --accent2:#7a9e5e; --accent3:#5b87b8;
    --chip:#f2ece3; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
    --done:#b5aa9c;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1c1a18; --card:#262320; --text:#eae4dc; --sub:#a39687;
      --line:#3a352f; --accent:#e08b6d; --accent2:#8fb36f; --accent3:#7aa3d0;
      --chip:#322d28; --shadow:0 1px 3px rgba(0,0,0,.3); --done:#6b6157;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:820px;margin:0 auto;padding:14px 14px 90px}
  header{text-align:center;padding:14px 0 10px}
  h1{font-size:1.35rem;letter-spacing:-.02em}
  .lead{color:var(--sub);font-size:.83rem;margin-top:3px}

  nav.tabs{
    display:flex;gap:6px;position:sticky;top:0;z-index:20;
    background:var(--bg);padding:9px 0;border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    flex:1;font:inherit;font-weight:600;font-size:.86rem;cursor:pointer;
    background:var(--chip);color:var(--sub);border:none;border-radius:10px;
    min-height:44px;padding:8px 4px;transition:.15s;
  }
  nav.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
  section.pane{display:none;padding-top:16px}
  section.pane.on{display:block}

  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .btn{
    font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;border:none;
    border-radius:10px;min-height:44px;padding:10px 16px;color:#fff;background:var(--accent);
    flex:1;min-width:130px;
  }
  .btn:active{opacity:.75}
  .btn.sec{background:var(--chip);color:var(--text)}
  .btn.g{background:var(--accent2)}

  .day{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .day.today{border-color:var(--accent);border-width:2px}
  .dayhead{font-weight:800;font-size:.98rem;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .badge{font-size:.66rem;font-weight:700;background:var(--accent);color:#fff;padding:2px 7px;border-radius:20px}
  .slot{
    display:flex;align-items:flex-start;gap:9px;padding:8px 0;
    border-top:1px solid var(--line);
  }
  .slot:first-of-type{border-top:none}
  .slotlabel{
    font-size:.72rem;font-weight:700;color:var(--sub);background:var(--chip);
    border-radius:6px;padding:3px 6px;white-space:nowrap;min-width:52px;text-align:center;flex-shrink:0;
  }
  .slotbody{flex:1;min-width:0}
  .slotname{font-weight:700;font-size:.95rem}
  .slotsub{font-size:.78rem;color:var(--sub);margin-top:1px}
  .reroll{
    background:none;border:none;font-size:1.05rem;cursor:pointer;padding:6px;
    min-width:44px;min-height:44px;flex-shrink:0;color:var(--sub);
  }
  .reroll:active{opacity:.5}

  .shop h3{
    font-size:.9rem;margin:18px 0 6px;color:var(--accent);
    display:flex;align-items:center;gap:6px;
  }
  .shop h3:first-child{margin-top:0}
  .item{
    display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;
    cursor:pointer;min-height:44px;
  }
  .item.checked .nm{text-decoration:line-through;color:var(--done)}
  .box{
    width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff;
  }
  .item.checked .box{background:var(--accent2);border-color:var(--accent2)}
  .nm{flex:1;font-size:.92rem;font-weight:600}
  .cnt{font-size:.74rem;color:var(--sub);background:var(--chip);padding:2px 7px;border-radius:20px}

  .empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:.9rem}

  details.pool{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:8px;
  }
  details.pool summary{font-weight:700;font-size:.93rem;cursor:pointer;list-style:none;min-height:32px;display:flex;align-items:center;gap:7px}
  details.pool summary::-webkit-details-marker{display:none}
  details.pool summary::after{content:"▾";margin-left:auto;color:var(--sub);font-size:.8rem}
  details.pool[open] summary::after{content:"▴"}
  .rec{font-size:.84rem;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .rec .ing{color:var(--sub);margin-bottom:5px}
  .rec b{color:var(--accent)}
  .t{font-size:.68rem;font-weight:700;background:var(--chip);color:var(--sub);padding:2px 7px;border-radius:20px}
  .t.fast{background:var(--accent2);color:#fff}

  footer{margin-top:30px;font-size:.75rem;color:var(--sub);text-align:center;line-height:1.7}
  .saved{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
    background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:.83rem;
    font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
  }
  .saved.show{opacity:.94}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>🍳 이번주 식단</h1>
  <p class="lead">버튼 한 번이면 일주일 식단과 장보기 목록이 나와요</p>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" onclick="tab(0,this)">📅 식단표</button>
  <button role="tab" aria-selected="false" onclick="tab(1,this)">🛒 장보기</button>
  <button role="tab" aria-selected="false" onclick="tab(2,this)">📖 메뉴 전체</button>
</nav>

<!-- 식단표 -->
<section class="pane on">
  <div class="bar">
    <button class="btn" onclick="rollWeek()">🎲 일주일치 새로 뽑기</button>
    <button class="btn sec" onclick="clearWeek()">지우기</button>
  </div>
  <div id="week"></div>
</section>

<!-- 장보기 -->
<section class="pane">
  <div class="bar">
    <button class="btn g" onclick="copyList()">📋 목록 복사</button>
    <button class="btn sec" onclick="resetChecks()">체크 초기화</button>
  </div>
  <div id="shop" class="shop"></div>
</section>

<!-- 메뉴 전체 -->
<section class="pane">
  <div id="allpool"></div>
</section>

<footer>
  노션 「인스타 저장 아카이브」 레시피 18건에서 정리한 메뉴 풀<br>
  아침 20 · 도시락 16 · 저녁 26
</footer>

</div>
<div class="saved" id="toast">저장됨</div>

     ing:[["통삼겹 또는 앞다리","정"],["배추","채"],["무","채"],["된장","양"],["대파","채"],["마늘","채"]],
     how:"된장·향신채 넣고 40~50분 삶기"},
    {n:"연어스테이크", sub:"굽기만 하면 끝",
     ing:[["연어","정"],["레몬","채"],["버터","유"],["소금","양"],["후추","양"]],
     how:"소금·후추 뿌려 버터에 앞뒤로 굽고 레몬"}
  ]
};

const DAYS = ["월","화","수","목","금","토","일"];
const SLOTS = [["b","아침"],["l","도시락"],["d","저녁"]];
const KEY = "weeklyMenu.v1";
const KEYCHK = "weeklyMenu.checks.v1";

let week = null;      // [{b:idx, l:idx, d:idx}, ...7]
let checks = {};      // {재료명:true}

/* ---------- 저장 / 불러오기 ---------- */
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(week));
    localStorage.setItem(KEYCHK, JSON.stringify(checks));
  }catch(e){}
}
function load(){
  try{
    const w = localStorage.getItem(KEY);
    if(w) week = JSON.parse(w);
    const c = localStorage.getItem(KEYCHK);
    if(c) checks = JSON.parse(c) || {};
  }catch(e){ week = null; checks = {}; }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1300);
}

/* ---------- 뽑기 ---------- */
function pickUnique(key, count){
  const n = POOL[key].length;
  const idx = [...Array(n).keys()];
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  const out=[];
  for(let i=0;i<count;i++) out.push(idx[i % n]);
  return out;
}
function rollWeek(){
  const b = pickUnique('b',7), l = pickUnique('l',7), d = pickUnique('d',7);
  week = DAYS.map((_,i)=>({b:b[i], l:l[i], d:d[i]}));
  checks = {};
  save(); render();
  toast("일주일치 뽑았어요");
}
function reroll(dayIdx, slot){
  const used = week.map(w=>w[slot]);
  const n = POOL[slot].length;
  let tries=0, next;
  do{ next = Math.floor(Math.random()*n); tries++; }
  while(used.includes(next) && tries<60);
  week[dayIdx][slot] = next;
  save(); render();
}
function clearWeek(){
  week = null; checks = {}; save(); render();
  toast("지웠어요");
}

/* ---------- 화면 그리기 ---------- */
function todayIdx(){
  const d = new Date();
  return (d.getDay() + 6) % 7; // 월=0
}
function render(){
  const wrap = document.getElementById('week');
  if(!week){
    wrap.innerHTML = '<div class="empty">아직 식단이 없어요.<br>위 <b>🎲 일주일치 새로 뽑기</b>를 눌러보세요.</div>';
    renderShop(); return;
  }
  const ti = todayIdx();
  wrap.innerHTML = week.map((day,i)=>{
    const slots = SLOTS.map(([k,label])=>{
      const m = POOL[k][day[k]];
      const sub = m.sub ? m.sub : (m.t ? m.t : "");
      return `<div class="slot">
        <span class="slotlabel">${label}</span>
        <div class="slotbody">
          <div class="slotname">${m.n}</div>
          ${sub ? `<div class="slotsub">${sub}</div>` : ""}
        </div>
        <button class="reroll" onclick="reroll(${i},'${k}')" aria-label="다시 뽑기">🔄</button>
      </div>`;
    }).join("");
    return `<div class="day${i===ti?' today':''}">
      <div class="dayhead">${DAYS[i]}요일 ${i===ti?'<span class="badge">오늘</span>':''}</div>
      ${slots}
    </div>`;
  }).join("");
  renderShop();
}

function buildShop(){
  if(!week) return {};
  const map = {}; // 재료 -> {cat, cnt}
  week.forEach(day=>{
    SLOTS.forEach(([k])=>{
      const m = POOL[k][day[k]];
      (m.ing||[]).forEach(([name,cat])=>{
        if(!map[name]) map[name] = {cat, cnt:0};
        map[name].cnt++;
      });
    });
  });
  return map;
}
function renderShop(){
  const el = document.getElementById('shop');
  const map = buildShop();
  const names = Object.keys(map);
  if(!names.length){
    el.innerHTML = '<div class="empty">식단을 먼저 뽑으면<br>장보기 목록이 자동으로 만들어져요.</div>';
    return;
  }
  let html = "";
  CATORDER.forEach(c=>{
    const list = names.filter(n=>map[n].cat===c).sort((a,b)=>map[b].cnt-map[a].cnt || a.localeCompare(b,'ko'));
    if(!list.length) return;
    html += `<h3>${CAT[c]} <span class="cnt">${list.length}</span></h3>`;
    html += list.map(n=>{
      const on = !!checks[n];
      return `<div class="item${on?' checked':''}" onclick="toggle('${n.replace(/'/g,"\\'")}')">
        <span class="box">${on?'✓':''}</span>
        <span class="nm">${n}</span>
        ${map[n].cnt>1?`<span class="cnt">${map[n].cnt}끼</span>`:''}
      </div>`;
    }).join("");
  });
  el.innerHTML = html;
}
function toggle(name){
  checks[name] = !checks[name];
  save(); renderShop();
}
function resetChecks(){
  checks = {}; save(); renderShop(); toast("체크를 지웠어요");
}
function copyList(){
  const map = buildShop();
  const names = Object.keys(map);
  if(!names.length){ toast("먼저 식단을 뽑아주세요"); return; }
  let txt = "🛒 이번주 장보기\n";
  CATORDER.forEach(c=>{
    const list = names.filter(n=>map[n].cat===c).sort((a,b)=>a.localeCompare(b,'ko'));
    if(!list.length) return;
    txt += `\n[${CAT[c]}]\n` + list.map(n=>`- ${n}${map[n].cnt>1?` (${map[n].cnt}끼)`:''}`).join("\n") + "\n";
  });
  const done = ()=>toast("복사했어요");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt,done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, cb){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast("복사 실패"); }
  document.body.removeChild(ta);
}

function renderPool(){
  const el = document.getElementById('allpool');
  const groups = [["b","☀️ 아침 (10분 안에)"],["l","🍱 도시락"],["d","🌙 저녁"]];
  el.innerHTML = groups.map(([k,title])=>{
    const items = POOL[k].map(m=>`
      <details class="pool">
        <summary>${m.n} ${m.t?`<span class="t fast">${m.t}</span>`:''}</summary>
        <div class="rec">
          ${m.sub?`<div class="ing">${m.sub}</div>`:''}
          ${m.r?`<div class="ing">${m.r}</div>`:''}
          ${m.how?`<div>${m.how}</div>`:''}
          ${!m.how&&!m.r?`<div class="ing">재료: ${(m.ing||[]).map(x=>x[0]).join(' · ')}</div>`:''}
        </div>
      </details>`).join("");
    return `<h3 style="font-size:1rem;margin:18px 0 8px">${title}</h3>${items}`;
  }).join("");
}

function tab(i, btn){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected','false'));
  btn.setAttribute('aria-selected','true');
  document.querySelectorAll('section.pane').forEach((s,n)=>s.classList.toggle('on', n===i));
  window.scrollTo({top:0, behavior:'smooth'});
}

load();
render();
renderPool();
</script>
</body>
</html>
